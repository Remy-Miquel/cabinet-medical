# ============================================================
# WEB-01 — Reverse proxy nginx pour l'application cabinet médical
# HTTPS 443 + headers de sécurité + redirection HTTP->HTTPS
# Flask/Gunicorn écoute en local sur 127.0.0.1:5000 (non exposé)
# ============================================================

# Redirection de tout le trafic HTTP (80) vers HTTPS (443)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- Certificat auto-signé ---
    ssl_certificate     /etc/nginx/ssl/cabinet.crt;
    ssl_certificate_key /etc/nginx/ssl/cabinet.key;

    # --- Durcissement TLS ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Headers de sécurité ---
    # Force HTTPS pour les prochaines visites (2 ans)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Empêche l'affichage dans une iframe (anti-clickjacking)
    add_header X-Frame-Options "DENY" always;
    # Empêche le navigateur de "deviner" le type MIME
    add_header X-Content-Type-Options "nosniff" always;
    # Contrôle les infos envoyées dans le Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restreint les API navigateur (caméra, micro, géoloc...)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Politique de sécurité du contenu (anti-XSS) — adaptée à ton front simple
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Masque la version de nginx
    server_tokens off;

    # --- Proxy vers Flask/Gunicorn ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
